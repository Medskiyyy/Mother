# JVM arguments for running Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure.
android.useAndroidX=true

# Only keep the transferable resource class for each module.
android.nonTransitiveRClass=true

# AGP 8.x requires JDK 17+; the system JAVA_HOME points to Java 8, so point
# Gradle at the JDK bundled with Android Studio.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr